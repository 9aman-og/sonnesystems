    <linearGradient id="ribbon" x1=".18" y1=".13" x2=".78" y2=".9"><stop offset="0" stop-color="#fff"/><stop offset=".34" stop-color="#f8ffff"/><stop offset=".72" stop-color="#d9f8ff"/><stop offset="1" stop-color="#aee7f3"/></linearGradient>
