<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AltPsi</title>
  <desc id="desc">Software should learn your way.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7f6f2"/>
      <stop offset="1" stop-color="#eef5f4"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="330" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20242d"/>
      <stop offset="1" stop-color="#090a0e"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="160" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b7cff"/>
      <stop offset=".5" stop-color="#587dff"/>
      <stop offset="1" stop-color="#46dce9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#121419" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#field)"/>
  <circle cx="1040" cy="40" r="250" fill="#63dce8" fill-opacity=".08"/>
  <circle cx="80" cy="590" r="210" fill="#7868ff" fill-opacity=".08"/>

  <g transform="translate(64 54)">
    <rect width="46" height="46" rx="13" fill="url(#tile)"/>
    <path d="M11 14h7l9 17" fill="none" stroke="url(#path)" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M27 11v26M39 14v6c0 7-5 11-12 11" fill="none" stroke="#f8f9fb" stroke-width="3.3" stroke-linecap="round"/>
    <text x="62" y="31" fill="#121419" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="-1">altpsi</text>
  </g>

  <text x="64" y="247" fill="#121419" font-family="Manrope, Arial, sans-serif" font-size="76" font-weight="600" letter-spacing="-5.5">Software should</text>
  <text x="64" y="334" fill="#747881" font-family="Manrope, Arial, sans-serif" font-size="76" font-weight="600" letter-spacing="-5.5">learn your way.</text>
  <text x="68" y="398" fill="#62656d" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="-.5">Personal software, built around the person.</text>

  <g transform="translate(819 158)" filter="url(#shadow)">
    <rect width="300" height="300" rx="78" fill="url(#tile)"/>
    <rect x="1" y="1" width="298" height="298" rx="77" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>
    <path d="M66 91h42l58 106" fill="none" stroke="url(#path)" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M167 74v174" fill="none" stroke="#f8f9fb" stroke-width="21" stroke-linecap="round"/>
    <path d="M258 90v40c0 44-34 72-91 72" fill="none" stroke="#f8f9fb" stroke-width="21" stroke-linecap="round"/>
  </g>
</svg>
